server {
    listen 80;
    server_name book.falconsit.tech www.book.falconsit.tech;
    root /usr/share/nginx/html;
    index index.html;

    # Fix: Include default Nginx MIME types table
    include /etc/nginx/mime.types;
    default_type text/html;

    # Gzip compression for performance
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/wasm;
    gzip_disable "MSIE [1-6]\.";

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets forever
    location ~* \.(?:css|js|mjs|wasm|jpg|svg|png|woff2?|eot|ttf|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Single Page Application fallback routing (must be last)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

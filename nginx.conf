server {
    listen 80;
    server_name book.falconsit.tech www.book.falconsit.tech;
    root /usr/share/nginx/html;
    index index.html;

    # Fix: Include default Nginx MIME types table
    include /etc/nginx/mime.types;
    default_type text/html;

    # Gzip compression for performance
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/wasm;
    gzip_disable "MSIE [1-6]\.";

    # Single Page Application fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets forever
    location ~* \.(?:css|js|mjs|wasm|jpg|svg|png|woff2?|eot|ttf|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
